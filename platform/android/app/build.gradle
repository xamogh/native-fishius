plugins { id 'com.android.application' }
android {
    namespace 'com.pixmot.aquarium'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.pixmot.aquarium'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DAQ_BUILD_APP=ON', '-DAQ_BUILD_TESTS=OFF', '-DAQ_FETCH_DEPENDENCIES=ON', '-DSDL_SHARED=ON', '-DSDL_STATIC=OFF', '-DSDLIMAGE_VENDORED=ON', '-DSDLTTF_VENDORED=ON'
                cppFlags '-std=c++20'
            }
        }
    }
    externalNativeBuild { cmake { path '../../../CMakeLists.txt'; version '3.30.5' } }
    sourceSets {
        main {
            assets.srcDirs = ['../../../assets']
            java.srcDirs += ['../../../third_party/SDL/android-project/app/src/main/java']
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
